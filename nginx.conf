server {
    # ${PORT} is substituted at container start by the nginx:alpine entrypoint.
    # Cloud Run injects $PORT (default 8080); local docker run can override it.
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # ── Health check ──────────────────────────────────────────────────────────
    # Served by nginx directly. This endpoint previously existed only in the
    # local Express dev server, so in production it fell through to the SPA
    # fallback below and returned index.html with a 200 — meaning any probe
    # pointed at it reported healthy unconditionally, including when the app
    # was broken. Must stay above `location /` to win the match.
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
        access_log off;
    }

    # ── React Router fallback ─────────────────────────────────────────────────
    # All routes that don't match a real file are served index.html so that
    # client-side navigation works after a hard refresh or direct URL entry.
    # Note: $uri uses a plain dollar sign — envsubst only replaces ${VAR} form.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite fingerprints every JS/CSS file with a content hash, so it is safe to
    # cache them for a full year.  The browser will never serve stale assets.
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires           1y;
        add_header        Cache-Control "public, immutable";
        access_log        off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header Referrer-Policy        "strict-origin"          always;
}
